# SPL Fails to load U-Boot from the VFAT partition without this
CONFIG_SPL_FS_FAT=y

# Needed to reduce SPL size and retain VFAT boot support
# CONFIG_SPL_SPI is not set

# Makes life easy, enables auto-boot & FPGA flashing at boot
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="fatload mmc 0:1 0x2000000 fpga.rbf; fpga load 0 0x2000000 ${filesize}; bridge enable; bootflow scan"
