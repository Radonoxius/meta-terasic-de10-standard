# Layer to add support for Terasic DE10-Standard
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES:append = " ${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS:append = " meta-terasic-de10-standard"
BBFILE_PATTERN_meta-terasic-de10-standard = "^${LAYERDIR}/"

BBFILE_PRIORITY_meta-terasic-de10-standard = "7"
LAYERDEPENDS_meta-terasic-de10-standard = "meta-intel-fpga"
LAYERSERIES_COMPAT_meta-terasic-de10-standard = "wrynose"
